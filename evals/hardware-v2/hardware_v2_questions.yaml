    refusal_reason: 《LDO 基础知识》不是 TPS7A05 数据手册，无法提供该器件的完整引脚和封装尺寸。

  - question_id: V2_LDO_REF_02
    question: 根据这份资料，今天采购 10,000 颗指定 LDO 的人民币单价、交期和可用库存是多少？
    language: zh-CN
    category: evidence_insufficiency
    domains: [power_management]
    topics: [ldo]
    answerable: false
    refusal_reason: 本地技术资料不包含实时价格、库存或交期信息。

  - question_id: V2_SAFE_ANS_01
    question: 爬电距离与电气间隙分别如何测量，它们主要受哪些不同因素影响？
    language: zh-CN
    category: safety_definition
    domains: [electrical_safety]
    topics: [creepage_clearance]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCP238_CREEPAGE_CLEARANCE_2024
        section_contains: 爬电距离和电气间隙
        page_numbers: [2]
    expected_key_facts:
      - 爬电距离沿固体绝缘表面测量，主要与工作电压、污染、湿度和材料组有关。
      - 电气间隙是在空气中的最短距离，主要与瞬态过压、海拔气压和污染有关。

  - question_id: V2_SAFE_ANS_02
    question: 污染等级 1 到 4 的环境特征如何逐级变化？办公室和室外持久潮湿环境通常分别属于哪一级？
    language: zh-CN
    category: pollution_degree
    domains: [electrical_safety]
    topics: [creepage_clearance]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCP238_CREEPAGE_CLEARANCE_2024
        section_contains: 污染等级
        page_numbers: [3]
    expected_key_facts:
      - 等级从无污染/干燥非导电污染逐步增加到持久导电污染。
      - 办公室通常是污染等级 2，室外雨水或持久潮湿环境常见污染等级 4。

  - question_id: V2_SAFE_ANS_03
    question: CTI 如何用于绝缘材料分组？常见 FR4 和 TI 隔离产品在资料中分别归入什么材料组？
    language: zh-CN
    category: material_group
    domains: [electrical_safety]
    topics: [creepage_clearance, insulation]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCP238_CREEPAGE_CLEARANCE_2024
        section_contains: 材料组和相对漏电起痕指数
        page_numbers: [3]
    expected_key_facts:
      - CTI 按材料在规定滴液测试中发生击穿前可承受的最大电压划分材料组。
      - 大多数 FR4 属于 IIIa，资料称 TI 隔离产品属于材料组 I。

  - question_id: V2_SAFE_ANS_04
    question: 瞬态过压类别按什么原则划分？类别 I 与类别 IV 的典型连接位置有何区别？
    language: zh-CN
    category: overvoltage_category
    domains: [electrical_safety]
    topics: [creepage_clearance, clearance]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCP238_CREEPAGE_CLEARANCE_2024
        section_contains: 瞬态过压类别
        page_numbers: [3]
    expected_key_facts:
      - 类别按设备相对于主电源的连接位置及遭遇瞬态的概率含义划分。
      - 类别 I 是经过限压方式连接的电路，类别 IV 是在原始安装点直接接入电源的设备。

  - question_id: V2_SAFE_ANS_05
    question: 确定基本或增强绝缘的爬电距离前，需要哪些输入条件？增强绝缘如何处理查表所得距离？
    language: zh-CN
    category: creepage_selection
    domains: [electrical_safety]
    topics: [creepage_clearance, insulation]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCP238_CREEPAGE_CLEARANCE_2024
        section_contains: 确定绝缘系统中的爬电距离以确保用户的安全
        page_numbers: [6]
    expected_key_facts:
      - 需要工作电压、绝缘材料组、污染等级以及适用的终端设备标准。
      - 基本绝缘使用查表值；资料所述流程中增强绝缘将该距离加倍。

  - question_id: V2_SAFE_ANS_06
    question: 确定电气间隙时为何必须知道瞬态电压、污染等级和海拔？海拔超过 2,000 m 后怎么办？
    language: zh-CN
    category: clearance_selection
    domains: [electrical_safety]
    topics: [creepage_clearance, clearance]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCP238_CREEPAGE_CLEARANCE_2024
        section_contains: 确定绝缘系统中的电气间隙以确保用户安全
        page_numbers: [7]
    expected_key_facts:
      - 电气间隙由所需脉冲电压、污染等级和终端设备标准共同决定。
      - 工作海拔超过 2,000 m 时，应按 IEC 60664-1 表 A.2 使用电气间隙倍增系数。

  - question_id: V2_SAFE_REF_01
    question: 某块 1,500 V PCB 的最小爬电距离和电气间隙各是多少毫米？
    language: zh-CN
    category: evidence_insufficiency
    domains: [electrical_safety]
    topics: [creepage_clearance, high_voltage_pcb]
    answerable: false
    refusal_reason: 未给出工作/瞬态电压性质、绝缘等级、材料组、污染等级、海拔和适用标准，不能唯一确定距离。

  - question_id: V2_SAFE_REF_02
    question: 仅凭这份资料，能否判定我的具体产品已经通过 UL 和 IEC 安规认证？
    language: zh-CN
    category: evidence_insufficiency
    domains: [electrical_safety]
