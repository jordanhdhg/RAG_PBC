schema_version: 2
dataset_id: hardware_rag_v2_stage4
description: >-
  通用硬件 RAG V2 阶段 4 新增的 50 道本地验收题。与不可变的 DDR V1 40 题合并后共 90 题；
  本题集包含 30 道新增资料单文档可回答题、10 道资料不足题、6 道显式跨领域题和 4 道歧义路由题。
validation_requirements:
  total_questions: 50
  answerable_questions: 36
  refusal_questions: 14
  min_answerable_by_language:
    zh-CN: 30
    en: 6
  required_source_doc_ids:
    - JEDEC_JESD79_2C_DDR2_SDRAM_2006
    - TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
    - TI_ZHCY093_LDO_BASICS_ZH
    - TI_ZHCP238_CREEPAGE_CLEARANCE_2024
    - COSH_IP_SIGNAL_INTEGRITY_TRAINING_2009
questions:
  - question_id: V2_DDR2_ANS_01
    question: DDR2 首次上电初始化时，CKE、ODT 和稳定电源/时钟后的等待时间有什么要求？
    language: zh-CN
    category: initialization_sequence
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: true
    expected_sources:
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.3.1 Power-up and initialization sequence
        page_numbers: [23]
    expected_key_facts:
      - 上电期间应尽量保持 CKE 低于 0.2×VDDQ，ODT 保持低电平。
      - 电源和时钟稳定后至少等待 200 μs，再施加 NOP 或 Deselect 并把 CKE 拉高。

  - question_id: V2_DDR2_ANS_02
    question: DDR2 的 ODT 功能终接哪些信号、由什么控制，以及在 Self Refresh 中是否可用？
    language: zh-CN
    category: termination
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: true
    expected_sources:
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.4.4 ODT (on-die termination)
        page_numbers: [33]
    expected_key_facts:
      - ODT 通过 ODT 控制引脚为 DQ、DQS、DM 等信号开关片上终接电阻。
      - ODT 用于改善内存通道信号完整性，在 Self Refresh 模式中关闭且不受支持。

  - question_id: V2_DDR2_ANS_03
    question: What is DDR2 Posted CAS, and how are additive latency, read latency, and write latency related?
    language: en
    category: command_timing
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: true
    expected_sources:
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.6.1 Posted CAS
        page_numbers: [39]
    expected_key_facts:
      - Posted CAS permits a CAS read or write immediately after RAS activation and holds it for additive latency.
      - RL equals AL plus CL, and WL equals RL minus one.

  - question_id: V2_DDR2_ANS_04
    question: Which burst lengths and burst types does DDR2 support, and what interruption restriction applies to BL=4?
    language: en
    category: burst_operation
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: true
    expected_sources:
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.6.2 Burst mode operation
        page_numbers: [40]
    expected_key_facts:
      - DDR2 supports burst lengths 4 and 8 with programmable sequential or interleaved burst type.
      - Interrupting a read or write burst in BL=4 is prohibited, and Burst Stop is not supported.

  - question_id: V2_DDR2_ANS_05
    question: 发出 DDR2 Refresh 命令前，各 Bank 必须处于什么状态？刷新完成后到下一条 Activate 或 Refresh 之间受什么时间约束？
    language: zh-CN
    category: refresh
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: true
    expected_sources:
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.9 Refresh command
        page_numbers: [55]
    expected_key_facts:
      - 所有 Bank 必须先预充电并至少空闲一个 tRP。
      - Refresh 到下一条 Activate 或 Refresh 的延迟必须不小于 tRFC。

  - question_id: V2_DDR2_ANS_06
    question: DDR2 Self Refresh 如何在没有外部时钟时保持数据？进入该模式前 ODT 和 CKE 应如何处理？
    language: zh-CN
    category: self_refresh
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: true
    expected_sources:
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.10 Self refresh operation
        page_numbers: [56]
    expected_key_facts:
      - 器件依靠内部定时器在没有外部时钟时执行自刷新并保持数据。
      - 发命令前必须关闭 ODT；命令登记后 CKE 必须保持低电平以维持 Self Refresh。

  - question_id: V2_DDR2_REF_01
    question: JESD79-2C 对 DDR2-1600 的 tCK、tRCD 和完整 AC 时序限值分别是多少？
    language: zh-CN
    category: evidence_insufficiency
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: false
    refusal_reason: JESD79-2C 的速度等级表覆盖 DDR2-400/533/667/800，不提供 DDR2-1600 的完整时序等级。

  - question_id: V2_DDR2_REF_02
    question: 这份 DDR2 标准中应怎样配置 DDR5 片上 ECC、Bank Group 和 Decision Feedback Equalization？
    language: zh-CN
    category: evidence_insufficiency
    domains: [memory]
    topics: [ddr2, sdram_standard]
    memory_type: DDR2
    answerable: false
    refusal_reason: 本资料是 DDR2 SDRAM 标准，不包含 DDR5 的片上 ECC、Bank Group 或均衡器配置。

  - question_id: V2_HSI_ANS_01
    question: What general rule does TI give for the total trace length of a high-speed signal pair?
    language: en
    category: trace_length
    domains: [high_speed_interface]
    topics: [high_speed_layout]
    answerable: true
    expected_sources:
      - doc_id: TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
        section_contains: 2.2 High-Speed Signal Trace Lengths
        page_numbers: [5]
    expected_key_facts:
      - Keep the total trace length of each high-speed signal pair to a minimum.
      - Device-specific trace-length requirements are listed separately in Appendix A.

  - question_id: V2_HSI_ANS_02
    question: For a high-speed differential interface, which lengths must match, and where should serpentine compensation be placed?
    language: en
    category: length_matching
    domains: [high_speed_interface]
    topics: [high_speed_layout]
    answerable: true
    expected_sources:
      - doc_id: TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
        section_contains: 2.3 High-Speed Signal Trace Length Matching
        page_numbers: [6]
    expected_key_facts:
      - Match the two traces within each differential pair; transmit-pair length need not match receive-pair length.
      - Add serpentine compensation as close as possible to the mismatched ends.

  - question_id: V2_HSI_ANS_03
    question: Why should high-speed traces stay over a solid ground reference plane instead of crossing a split or void?
    language: en
    category: reference_plane
    domains: [high_speed_interface]
    topics: [high_speed_layout]
    answerable: true
    expected_sources:
      - doc_id: TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
        section_contains: 2.4 High-Speed Signal Reference Planes
        page_numbers: [6]
    expected_key_facts:
      - A split or void forces high-frequency return current around the discontinuity and increases loop inductance.
      - Consequences include emissions, propagation delay, adjacent-signal interference, more jitter, and lower amplitude.

  - question_id: V2_HSI_ANS_04
    question: What is TI's 5W spacing rule for high-speed differential pairs, and what spacing results from a 6 mil trace width?
    language: en
    category: differential_spacing
    domains: [high_speed_interface]
    topics: [high_speed_layout]
    answerable: true
    expected_sources:
      - doc_id: TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
        section_contains: 3.1 Differential Signal Spacing
        page_numbers: [9]
    expected_key_facts:
      - Adjacent high-speed differential pairs require spacing of at least five times the trace width.
      - A 6 mil trace width therefore requires at least 30 mil between pairs.

  - question_id: V2_HSI_ANS_05
    question: USB 通孔插座和表贴插座的高速差分线分别建议从哪一层连接，原因是什么？
    language: zh-CN
    category: connector_layout
    domains: [high_speed_interface]
    topics: [usb, high_speed_layout]
    applicable_interfaces: [usb]
    answerable: true
    expected_sources:
      - doc_id: TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
        section_contains: 3.5 Connectors and Receptacles
        page_numbers: [10]
    expected_key_facts:
      - 通孔插座建议在 PCB 底层连接，以免通孔引脚成为传输路径 Stub。
      - 表贴插座建议在顶层连接，以避免传输路径中引入过孔。

  - question_id: V2_HSI_ANS_06
    question: 高速信号过孔为什么会造成不连续，TI 对 Stub 长度和过长 Stub 的处理有什么建议？
    language: zh-CN
    category: via_discontinuity
    domains: [high_speed_interface]
    topics: [high_speed_layout]
    answerable: true
    expected_sources:
      - doc_id: TI_SPRAAR7J_HIGH_SPEED_INTERFACE_LAYOUT_REV_J
        section_contains: 3.6 Via Discontinuity Mitigation
        page_numbers: [11]
    expected_key_facts:
      - 过孔几何变化可表现为容性或感性不连续，导致反射和信号劣化。
      - TI 建议 Stub 小于 15 mil，较长 Stub 需要背钻。

  - question_id: V2_HSI_REF_01
    question: 依据这份指南，PCIe 6.0 64 GT/s 通道从封装到连接器的精确插损预算是多少 dB？
    language: zh-CN
    category: evidence_insufficiency
    domains: [high_speed_interface]
    topics: [pcie, high_speed_layout]
    applicable_interfaces: [pcie]
    answerable: false
    refusal_reason: 该通用布局指南未给出 PCIe 6.0 64 GT/s 的完整通道插损预算，需查对应器件和 PCIe 规范。

  - question_id: V2_HSI_REF_02
    question: 这份资料能否给出 USB4 80Gbps 连接器的完整认证测试项目、仪器设置和合格限值？
    language: zh-CN
    category: evidence_insufficiency
    domains: [high_speed_interface]
    topics: [usb, high_speed_layout]
    applicable_interfaces: [usb]
    answerable: false
    refusal_reason: 资料只提供通用高速接口布局建议，不包含 USB4 80Gbps 的完整认证测试规范。

  - question_id: V2_LDO_ANS_01
    question: LDO 的压降电压如何定义？输入电压低于所需余量时输出会怎样？
    language: zh-CN
    category: dropout
    domains: [power_management]
    topics: [ldo]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCY093_LDO_BASICS_ZH
        section_contains: 什么是压降？
        page_numbers: [3]
    expected_key_facts:
      - 压降是为维持正常稳压所需的最小 VIN−VOUT 压差。
      - 余量不足时 LDO 进入压降状态并停止正常调节，输出开始跟随输入变化。

  - question_id: V2_LDO_ANS_02
    question: LDO 的静态电流和关断电流分别描述什么工作状态下的电流消耗？
    language: zh-CN
    category: quiescent_current
    domains: [power_management]
    topics: [ldo]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCY093_LDO_BASICS_ZH
        section_contains: 什么是静态电流？
        page_numbers: [11]
    expected_key_facts:
      - 静态电流是系统待机且轻载或空载时消耗的电流。
      - 关断电流是器件关闭但系统仍连接电池时消耗的电流。

  - question_id: V2_LDO_ANS_03
    question: LDO 的“砖墙”电流限制与恒流源有什么区别，内部限流的目的是什么？
    language: zh-CN
    category: current_limit
    domains: [power_management]
    topics: [ldo]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCY093_LDO_BASICS_ZH
        section_contains: 什么是电流限制功能，该功能如何运作？
        page_numbers: [13]
    expected_key_facts:
      - 限流建立输出电流上限，LDO 仍按负载需求供电而不是作为恒流源。
      - 达到设定限值后输出电流被突然限制，因此称为砖墙限流。

  - question_id: V2_LDO_ANS_04
    question: LDO 出现从 VOUT 流向 VIN 的反向电流时，典型电流路径和潜在风险是什么？
    language: zh-CN
    category: reverse_current
    domains: [power_management]
    topics: [ldo]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCY093_LDO_BASICS_ZH
        section_contains: 作者： Mark Sellers
        page_numbers: [15]
    expected_key_facts:
      - 反向电流通常从 VOUT 经导通 FET 的体二极管流向 VIN，而非走正常导电通道。
      - 该电流可能造成长期可靠性问题甚至损坏器件。

  - question_id: V2_LDO_ANS_05
    question: LDO 的 PSRR 表示什么？为什么只看数据表在 120 Hz 或 1 kHz 的单点数值可能不够？
    language: zh-CN
    category: psrr
    domains: [power_management]
    topics: [ldo, power_integrity]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCY093_LDO_BASICS_ZH
        section_contains: 什么是 PSRR ？
        page_numbers: [17]
    expected_key_facts:
      - PSRR 描述特定频率的输入交流成分被衰减到输出的程度，TI 用更高的正 dB 值表示更强衰减。
      - PSRR 随频率和工作条件变化，单个 120 Hz 或 1 kHz 指标不能代表完整滤波能力。

  - question_id: V2_LDO_ANS_06
    question: NR/SS 引脚上的降噪电容如何影响 LDO 输出噪声、启动斜率和浪涌电流？
    language: zh-CN
    category: noise_reduction
    domains: [power_management]
    topics: [ldo, power_integrity]
    answerable: true
    expected_sources:
      - doc_id: TI_ZHCY093_LDO_BASICS_ZH
        section_contains: 降噪电容器
        page_numbers: [20]
    expected_key_facts:
      - CNR/SS 与内部电阻形成低通滤波器，可降低参考源噪声。
      - 增大 CNR/SS 会减慢输出启动斜率并可降低浪涌电流，但也会延长启动时间。

  - question_id: V2_LDO_REF_01
    question: 请给出 TPS7A05 每个引脚的精确编号、封装焊盘尺寸和推荐 PCB 封装图。
    language: zh-CN
