        page_numbers: [3]
      - doc_id: JEDEC_JESD79_2C_DDR2_SDRAM_2006
        section_contains: 2.3.1 Power-up and initialization sequence
        page_numbers: [23]
    expected_key_facts:
      - LDO 输入余量不足会退出正常稳压，使 DDR2 电源轨不能保证规定稳态。
