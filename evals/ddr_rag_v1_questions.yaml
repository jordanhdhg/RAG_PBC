# DDR RAG V1 baseline. This file is ground truth, not a source of engineering rules.
# Every answerable expected_sources entry must be retrieved by a later eval run.
schema_version: 1
dataset_id: ddr_rag_v1
description: >-
  Forty locally anchored DDR RAG evaluation cases: thirty answerable questions and
  ten required-refusal questions. Answerable questions span Rockchip RK3568, TI
  AM62x/AM62Lx and NXP i.MX 8M Plus source guides.
questions:
  - question_id: DDR_ANS_RK3568_01
    question: RK3568 DDR4 CLK 差分对的目标阻抗是多少？
    language: zh-CN
    category: impedance
    memory_type: DDR4
    answerable: true
    expected_sources:
      - doc_id: ROCKCHIP_RK3568_HARDWARE_DESIGN_GUIDE_CN_V1_2
        section_contains: DDR4 CLK
        page_numbers: [165, 166]
    expected_key_facts: ["差分阻抗 100 Ω ±10%"]

